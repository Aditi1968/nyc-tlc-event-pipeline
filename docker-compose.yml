# Everything runs locally, at no cost.
#   docker compose up -d kafka postgres
#   docker compose run --rm spark            stream job (Kafka -> Postgres)
#   docker compose --profile airflow up      backfill DAG at http://localhost:8080
x-pg-env: &pg-env
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: tlc
  PGUSER: tlc
  PGPASSWORD: tlc # local development only; the port is bound to 127.0.0.1

services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m # laptop-sized
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168 # keep events long enough to replay

  postgres:
    image: postgres:16
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_DB: tlc
      POSTGRES_USER: tlc
      POSTGRES_PASSWORD: tlc
    volumes:
      - pgdata:/var/lib/postgresql/data

  spark:
    image: apache/spark:3.5.3-python3
    profiles: [local]
    user: root
    working_dir: /app
    environment:
      <<: *pg-env
    volumes:
      - ./:/app
      - spark_out:/out # checkpoint + batch output; Spark cannot chmod on a Windows bind mount
    entrypoint: ["bash", "-c"]
    command:
      - >
        pip install -q psycopg2-binary &&
        /opt/spark/bin/spark-submit
        --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.postgresql:postgresql:42.7.4
        --conf spark.jars.ivy=/tmp/ivy
        --py-files scripts/merge.py
        streaming/stream_job.py
        --bootstrap kafka:29092 --checkpoint /out/checkpoint
        --max-offsets ${MAX_OFFSETS:-200000}

  airflow:
    image: apache/airflow:2.10.4
    profiles: [airflow]
    command: standalone
    ports: ["127.0.0.1:8080:8080"]
    environment:
      <<: *pg-env
      PYTHONPATH: /opt/airflow/scripts
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts

volumes:
  pgdata:
  spark_out:
